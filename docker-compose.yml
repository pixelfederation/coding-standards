x-php-common: &php_common
  pull_policy: always
  volumes:
    - .gitconfig:/root/.gitconfig
    - .:/srv/www:delegated
  environment:
    COMPOSER_MEMORY_LIMIT: -1

x-php-build: &php_build
  context: ./
  dockerfile: ./docker/php/Dockerfile

services:
  coding-standards-php8.4:
    <<: *php_common
    container_name: coding-standards-php8.4
    build:
      <<: *php_build
      args:
        PHP_VERSION: 8.4

  coding-standards-php8.5:
    <<: *php_common
    container_name: coding-standards-php8.5
    build:
      <<: *php_build
      args:
        PHP_VERSION: 8.5

  coding-standards-php-min:
    extends:
      service: coding-standards-php8.4
    container_name: coding-standards-php-min
